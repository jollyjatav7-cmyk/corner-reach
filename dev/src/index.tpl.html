<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="角球到达">
<meta name="theme-color" content="#2F6C4B">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<title>角球到达与选择</title>
<style>
/*__CSS__*/
</style>
</head>
<body>
<div class="app">
  <div class="pipband" id="pipBand" aria-hidden="true">视频浮窗放在这里（功能 → 视频浮窗 可以调整）</div>
  <header class="bar">
    <div class="meta">
      <input id="fLg" placeholder="输入联赛" maxlength="24" autocomplete="off" aria-label="联赛">
      <span class="sub" id="mDate"></span>
    </div>
    <div class="score">
      <div class="tn h"><input id="fH" placeholder="主队" maxlength="20" autocomplete="off" aria-label="主队名称"><button class="cks" id="ckH" data-a="fix">角球 0</button></div>
      <button class="gl h" id="glH" data-a="fix" aria-label="主队进球，点一下补录或校正">0</button>
      <div class="clk idle" id="clk">
        <button class="clkbtn" id="clkBtn" data-a="clock" aria-label="比赛时间"><span id="perL">上半场</span><b id="clkT">00:00</b></button>
        <button class="run" id="runBtn" aria-label="开始计时"></button>
      </div>
      <button class="gl a" id="glA" data-a="fix" aria-label="客队进球，点一下补录或校正">0</button>
      <div class="tn a"><input id="fA" placeholder="客队" maxlength="20" autocomplete="off" aria-label="客队名称"><button class="cks" id="ckA" data-a="fix">角球 0</button></div>
    </div>
    <div class="tools">
      <button class="netpill" id="netPill" data-a="netpill" hidden></button>
      <button class="tbtn nbtn" id="numBtn" data-a="hidenum"></button>
      <button class="tbtn ic" data-a="menu" aria-label="功能"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M3 5h12M3 9h12M3 13h12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
    </div>
  </header>
  <nav class="modebar" aria-label="切换程序"><div class="mseg" id="mseg"><button data-a="mode" data-v="rec" aria-pressed="true">到达与选择</button><button data-a="mode" data-v="q" aria-pressed="false">两个问题</button></div><button class="mbn none" id="mBan" data-a="mdl" hidden></button></nav>
  <section class="sugg" id="sugg" hidden aria-live="polite"></section>
  <main class="main">
    <section class="pad" data-i="0" aria-label="主队进攻"></section>
    <section class="mid" id="mid" aria-label="统计">
      <div class="mid-top"><span class="grip"></span><button class="mid-x" data-a="midclose">收起</button></div>
      <div id="stats"></div>
    </section>
    <section class="pad" data-i="1" aria-label="客队进攻"></section>
  </main>
</div>
<div class="strip" id="strip">
  <div class="recent" id="recent"></div>
  <button class="qb" data-a="undo" id="qbUndo"></button>
  <button class="qb" data-a="qsync" id="qbSync"></button>
  <button class="qb only-pad" data-a="list" id="qbList"></button>
  <button class="qb only-phone" data-a="stats" id="qbStats"></button>
  <button class="qb" data-a="arch" id="qbArch"></button>
  <button class="qb" data-a="menu" id="qbMenu"></button>
</div>
<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" hidden><div class="card" id="card" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden><span id="toastMsg"></span><button id="toastBtn" hidden>撤销</button></div>
<input type="file" id="fileIn" class="vh" accept=".json,application/json,text/plain" tabindex="-1" aria-hidden="true">
<script>
(function(){
'use strict';
//__JS__
})();
</script>
</body>
</html>
