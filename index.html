<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="角球到达">
<meta name="theme-color" content="#2F6C4B">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<title>角球到达与选择</title>
<style>
:root{
  --paper:#F1F3EF; --card:#FFFFFF; --raise:#F5F7F4; --ink:#14201A; --ink2:#46544C; --muted:#748178; --rule:#D3DAD4; --line2:#E3E7E2;
  --grass:#2F6C4B; --pitch:#24573D; --pitch2:#1F4D35; --chalk:#F3F5EE; --chalk2:rgba(243,245,238,.66); --tile:rgba(255,255,255,.08); --tile2:rgba(255,255,255,.16);
  --flag:#F2C230; --on-flag:#2A2100; --home:#2A58D3; --away:#CF4229; --warn:#B3261E; --ok:#2F8A57; --scrim:rgba(8,14,10,.45);
  /* 图表：两队、五个选择（颜色检验过色盲与对比） */
  --hm:#2A58D3; --am:#CF4229;
  --cx:#eb6834; --cl:#6250d6; --cm:#1baf7a; --cb:#b4bab5; --cg:#7c847e; --tcb:#14201A; --tcg:#FFFFFF; --trk:#E9ECE9;
  /* 简易模型：大角（黄，跟角球旗一样）、小角（青）、让球（投哪队就用那队的颜色），字色都检验过对比 */
  --big:#F2C230; --on-big:#2A2100; --bigtx:#8A6400; --small:#0F6E78; --on-small:#FFFFFF; --hc0:#2A58D3; --on-hc0:#FFFFFF; --hc1:#B8371F; --on-hc1:#FFFFFF;
  --f-ui:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;
  --f-num:"Avenir Next Condensed","DIN Condensed","Roboto Condensed","Arial Narrow",-apple-system,sans-serif;
  --pipH:0px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --paper:#101613; --card:#18201C; --raise:#1C2520; --ink:#E4EAE5; --ink2:#AFBAB3; --muted:#7F8C85; --rule:#2B3530; --line2:#28322D;
  --grass:#2B6445; --pitch:#1E4A33; --pitch2:#1A422D; --home:#86A9FF; --away:#FF8E72; --warn:#FF6B5E; --ok:#5CC08A; --scrim:rgba(0,0,0,.6);
  --hm:#4a7be6; --am:#e0573e;
  --cx:#d95926; --cl:#9085e9; --cm:#199e70; --cb:#5b645e; --cg:#8b948e; --tcb:#F3F5EE; --tcg:#0E1611; --trk:#26302B;
  --bigtx:#F2C230; --small:#5CC6D0; --on-small:#0E1611; --hc0:#86A9FF; --on-hc0:#0E1611; --hc1:#FF8E72; --on-hc1:#0E1611;
  color-scheme:dark;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font:15px/1.4 var(--f-ui);-webkit-text-size-adjust:100%;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:2px solid var(--flag);outline-offset:2px}
input,textarea{font:inherit;color:inherit}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- 比分列 ---------- */
.app{min-height:100%;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
.bar{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:12px;padding:10px 20px 6px}
.meta{display:flex;flex-direction:column;gap:2px;min-width:0}
.meta input{border:0;background:none;padding:0;font-weight:600;font-size:15px;min-width:0;width:100%}
.meta input::placeholder{color:var(--muted)}
.meta .sub{font-size:12px;color:var(--muted)}
.score{display:grid;grid-template-columns:minmax(0,9em) auto auto auto minmax(0,9em);align-items:center;gap:10px}
.tn{display:flex;flex-direction:column;min-width:0}
.tn.h{align-items:flex-end;text-align:right} .tn.a{align-items:flex-start}
.tn input{border:0;background:none;padding:0;font-weight:700;font-size:17px;width:100%;text-overflow:ellipsis}
.tn.h input{text-align:right;color:var(--home)} .tn.a input{color:var(--away)}
.tn input::placeholder{color:inherit;opacity:.55}
.cks{border:0;background:none;padding:3px 0;font-size:12px;color:var(--muted);text-decoration:underline dotted;text-underline-offset:3px;white-space:nowrap}
.gl{border:0;background:none;padding:0 3px;border-radius:8px;font:600 40px/1 var(--f-num);min-width:.7em;text-align:center}
.gl.h{color:var(--home)} .gl.a{color:var(--away)}
.gl:active,.cks:active{background:var(--rule)}
.clk{display:flex;align-items:center;gap:8px}
.clkbtn{border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center}
.clkbtn span{font-size:12px;color:var(--muted);line-height:1}
.clkbtn b{font:600 34px/1.05 var(--f-num);font-variant-numeric:tabular-nums}
.clk.idle .clkbtn b{color:var(--muted)}
.run{width:40px;height:40px;border-radius:20px;border:0;background:var(--grass);color:var(--chalk);display:grid;place-items:center}
.run.on{background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 1px var(--rule)}
.run svg{width:16px;height:16px}
.bar .tools{justify-self:end;display:flex;gap:6px;align-items:center}
.tbtn{height:36px;padding:0 12px;border:0;border-radius:10px;background:none;color:var(--ink2);font-weight:500;white-space:nowrap}
.tbtn:active{background:var(--rule)}
.tbtn.ic{width:40px;padding:0;display:grid;place-items:center}
/* 隐藏数字：右上角的按钮、第一部分视窗的按钮；隐藏中按钮变深色，拖动条旁边只留划掉的眼睛 */
.tbtn.nbtn{display:inline-flex;align-items:center;gap:5px;padding:0 10px;font-size:13px;font-weight:600}
.tbtn.nbtn.on{background:var(--ink);color:var(--paper)}
.tbtn.nbtn svg,.pill.npill svg{width:18px;height:18px;flex:none}
.pill.npill{display:inline-flex;align-items:center;gap:6px;padding:0 12px}
.nh{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font:600 14px/1.2 var(--f-ui);white-space:nowrap}
.nh svg{width:22px;height:22px;flex:none}
.qval .nh svg{width:26px;height:26px}
/* 三个程序的切换；右边是简易模型的提示（不会把下面的按键挤下去） */
.modebar{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,420px) minmax(0,1fr);align-items:center;gap:12px;padding:0 20px 6px;flex:none}
.mseg{grid-column:2;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));width:100%;background:var(--card);border:1px solid var(--line2);border-radius:12px;padding:3px}
.mseg button{height:32px;border:0;border-radius:9px;background:none;font-size:14px;font-weight:600;color:var(--ink2);white-space:nowrap}
.mseg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.mbn{grid-column:3;justify-self:start;height:40px;max-width:100%;min-width:0;border:0;border-radius:12px;padding:0 12px 0 10px;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;overflow:hidden;color:var(--muted);background:var(--card);box-shadow:inset 0 0 0 1px var(--line2)}
.mbn[hidden]{display:none}
.mbn svg{width:20px;height:20px;flex:none}
.mbn .tx{display:flex;flex-direction:column;align-items:flex-start;line-height:1.15;flex:none}
.mbn .t1{font-size:10.5px;font-weight:600;opacity:.8}
.mbn .t2{font-size:15px;font-weight:800}
.mbn.none .t2{font-size:13px;font-weight:600}
.mbn .tm{font-size:14px;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis}
.mbn.big{background:var(--big);color:var(--on-big);box-shadow:none}
.mbn.small{background:var(--small);color:var(--on-small);box-shadow:none}
.mbn.hc0{background:var(--hc0);color:var(--on-hc0);box-shadow:none}
.mbn.hc1{background:var(--hc1);color:var(--on-hc1);box-shadow:none}
.mbn.new{animation:mbn .8s ease-in-out 3}
@keyframes mbn{0%,100%{box-shadow:0 0 0 0 rgba(242,194,48,0)}50%{box-shadow:0 0 0 6px rgba(242,194,48,.6)}}
@media (prefers-reduced-motion:reduce){.mbn.new{animation:none}}
/* 每队名字旁边的“大角／小角” */
.mbg{display:inline-flex;align-items:center;gap:3px;height:24px;padding:0 8px 0 6px;border:0;border-radius:12px;font-size:13px;font-weight:800;white-space:nowrap;flex:none}
.mbg svg{width:13px;height:13px;flex:none}
.mbg.big{background:var(--big);color:var(--on-big)}
.mbg.small{background:var(--small);color:var(--on-small)}
.mbg.off{background:var(--paper);color:var(--muted);font-weight:600;box-shadow:inset 0 0 0 1px var(--rule)}

/* ---------- 主区：iPad 三栏（统计在中间） ---------- */
.main{flex:1;display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,390px) minmax(0,1fr);grid-template-areas:"home mid away";gap:14px;padding:6px 20px 76px;align-items:start}
.pad[data-i="0"]{grid-area:home} .pad[data-i="1"]{grid-area:away} .mid{grid-area:mid}
.pad{min-width:0}
body.qmode .main{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"home away"}
body.qmode .mid{display:none}
/* 比赛结束后：记录按键换成“这场已经结束”卡片 */
.endc{background:var(--card);color:var(--ink);border:1px solid var(--rule);border-radius:18px;padding:22px 18px;display:flex;flex-direction:column;gap:10px;align-items:stretch}
.endc h2{margin:0;font-size:20px;line-height:1.3}
.endc .es{margin:0;font:600 17px/1.5 var(--f-ui)}
.endc .es .h{color:var(--home)} .endc .es .a{color:var(--away)}
.endc .hint{margin:0}
.endc .linkb{border:0;background:none;color:var(--ink2);font:500 13.5px var(--f-ui);text-decoration:underline;padding:8px 0;align-self:center}
body.ended .pad[data-i="1"]{display:none}
@media (max-width:899px){body.ended .pad[data-i="0"]{grid-column:1 / -1}}
@media (min-width:900px){body.ended .main{grid-template-areas:"home mid mid"}body.ended.qmode .main{grid-template-columns:minmax(0,1fr);grid-template-areas:"home"}}
.pad-h{display:flex;align-items:center;gap:8px;padding:2px 2px 8px;font-size:14px;min-width:0}
.pad-h i{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.pad[data-i="0"] .pad-h i{background:var(--home)} .pad[data-i="1"] .pad-h i{background:var(--away)}
.pad-h b{font-size:16px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pad[data-i="0"] .pad-h b{color:var(--home)} .pad[data-i="1"] .pad-h b{color:var(--away)}
.pad-h .who{font-size:12px;color:var(--muted);white-space:nowrap;flex:none}
.pad-h .sp{flex:1}
.undo{height:30px;padding:0 12px;border-radius:15px;border:1px solid var(--line2);background:var(--card);font-size:13px;font-weight:600;color:var(--ink2);white-space:nowrap;flex:none}
.undo.hot{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.undo:disabled{opacity:.35}
/* 第一部分（主观）：四项的摘要，点开选择 */
.p1s{width:100%;border:1px solid var(--line2);background:var(--card);border-radius:14px;padding:4px;margin:0 0 8px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:2px}
.p1s button{position:relative;border:0;background:none;border-radius:10px;padding:4px 7px 8px;display:flex;flex-direction:column;align-items:flex-start;min-width:0;text-align:left;color:var(--ink)}
.p1bar{position:absolute;left:7px;right:7px;bottom:3px;height:3px;border-radius:2px;background:var(--trk);overflow:hidden}
.p1bar i{display:block;height:100%;border-radius:2px;background:var(--ink2)}
.pad[data-i="0"] .p1bar i{background:var(--hm)} .pad[data-i="1"] .p1bar i{background:var(--am)}
.p1s button:active{background:var(--raise)}
.p1s em{font-style:normal;font-size:11px;color:var(--muted);line-height:1.3}
.p1s b{font-size:13.5px;font-weight:600;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.p1s b.na{color:var(--muted);font-weight:500}
.board{background:var(--pitch);color:var(--chalk);border-radius:18px;padding:10px;display:flex;flex-direction:column;gap:7px}
.k{position:relative;border:0;border-radius:12px;background:var(--tile);color:var(--chalk);display:flex;align-items:center;justify-content:center;gap:8px;min-width:0;padding:6px 8px;min-height:50px}
.k:active{background:var(--tile2)}
.k .l{font-size:15px;font-weight:600;line-height:1.15;text-align:center;white-space:nowrap}
.k .c{font:600 19px/1 var(--f-num);font-variant-numeric:tabular-nums;color:var(--chalk2)}
.k.arb{min-height:66px;background:var(--chalk);color:var(--pitch)}
.k.arb .l{font-size:21px;font-weight:700}
.k.arb .c{font-size:28px;color:var(--pitch);opacity:.6}
.k.arb:active{background:#fff}
.k.arb.on{box-shadow:0 0 0 3px var(--flag)}
.k.ckb{background:transparent;box-shadow:inset 0 0 0 1.5px rgba(242,194,48,.7);min-height:44px}
.k.ckb .l{font-size:14px;color:var(--flag)} .k.ckb .c{color:var(--flag);font-size:17px}
.k.ckb svg{width:15px;height:15px;color:var(--flag)}
.k.hit{animation:hit .45s ease-out}
@keyframes hit{0%{background:rgba(243,245,238,.6)}100%{background:var(--tile)}}
.k.arb.hit{animation:hita .45s ease-out}
@keyframes hita{0%{background:var(--flag)}100%{background:var(--chalk)}}
@media (prefers-reduced-motion:reduce){.k.hit,.k.arb.hit{animation:none}}
/* 到达后的选择链 */
.stage{position:relative;display:flex;flex-direction:column;gap:6px;border-radius:14px;padding:6px;background:rgba(0,0,0,.12)}
.stage.open{background:var(--pitch2);box-shadow:inset 0 0 0 2px var(--flag)}
.sth{display:flex;align-items:center;gap:8px;min-height:24px;padding:0 4px;font-size:13px;color:var(--chalk2);min-width:0}
.sth .tm{font:600 20px/1 var(--f-num);font-variant-numeric:tabular-nums;color:var(--flag);flex:none}
.sth .tm small{font:500 12px var(--f-ui);margin-left:1px}
.sth .q{font-weight:600;color:var(--chalk);white-space:nowrap;flex:none}
.sth .crumb{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sth .crumb b{color:var(--chalk);font-weight:600}
.sth .last{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sth .pulse{width:8px;height:8px;border-radius:50%;background:var(--flag);flex:none;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.sth .pulse{animation:none}}
.sto{display:grid;gap:6px;grid-template-columns:repeat(2,minmax(0,1fr))}
.sto.n5 .k:first-child{grid-column:1 / -1}
.sto.n3{grid-template-columns:repeat(3,minmax(0,1fr))}
.sto .k{min-height:54px;flex-direction:row}
.sto .k .l{font-size:16px}
.sto .k i{width:9px;height:9px;border-radius:50%;flex:none}
.sto .k small{display:block;font-size:11px;font-weight:500;color:var(--chalk2);margin-top:1px}
.sto .k .lw{display:flex;flex-direction:column;align-items:flex-start;min-width:0}
.sto .k.res-g{box-shadow:inset 0 0 0 1.5px var(--chalk2)}
.sto .k.res-c{background:rgba(242,194,48,.22)} .sto .k.res-c .l{color:var(--flag)}
.stage.idle .sto .k{background:rgba(255,255,255,.05)}
.stage.idle .sto .k .l{color:var(--chalk2);font-weight:500}
.stage.open .sto .k{background:var(--tile2)}
.stage.open .sto .k:active{background:rgba(255,255,255,.3)}
.stf{display:flex;gap:6px}
.stf button{flex:1;height:32px;border:0;border-radius:16px;background:none;box-shadow:inset 0 0 0 1px rgba(243,245,238,.3);color:var(--chalk2);font-size:12.5px;white-space:nowrap;padding:0 6px}
.stf button:active{background:var(--tile)}
.c-x{background:var(--cx)} .c-l{background:var(--cl)} .c-m{background:var(--cm)} .c-b{background:var(--cb)} .c-g{background:var(--cg)} .c-o{background:var(--cg)}

/* ---------- 拖动条（第一部分、两个问题、模型标准） ---------- */
.sl{position:relative;height:44px;padding:0 15px;display:flex;align-items:center;touch-action:pan-y;cursor:pointer;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;outline:none}
.sl-t{position:relative;flex:1;height:8px;border-radius:4px;background:var(--trk)}
.sl-f{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--ink2)}
.sl-k{position:absolute;top:50%;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;background:var(--card);box-shadow:0 1px 5px rgba(0,0,0,.28),inset 0 0 0 2.5px var(--ink2)}
.sl:focus-visible .sl-k{outline:3px solid var(--flag);outline-offset:1px}
.sl.h .sl-f{background:var(--hm)} .sl.h .sl-k{box-shadow:0 1px 5px rgba(0,0,0,.28),inset 0 0 0 2.5px var(--hm)}
.sl.a .sl-f{background:var(--am)} .sl.a .sl-k{box-shadow:0 1px 5px rgba(0,0,0,.28),inset 0 0 0 2.5px var(--am)}
.sl.bq .sl-t{background:var(--am)} .sl.bq .sl-f{background:var(--hm);border-radius:4px 0 0 4px}
.sl.bq .sl-k{box-shadow:0 1px 5px rgba(0,0,0,.28),inset 0 0 0 2.5px var(--ink)}
.sl.na .sl-f{display:none}
.sl.na .sl-t{background:var(--trk)}
.sl.na .sl-k{background:var(--paper);box-shadow:inset 0 0 0 2px var(--muted);opacity:.7}
.sl.big{height:52px;padding:0 19px}
.sl.big .sl-t{height:12px;border-radius:6px}
.sl.big .sl-k{width:38px;height:38px;margin:-19px 0 0 -19px}
.slends{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--muted);margin-top:-6px;padding:0 4px}
/* 拖动条两边的按钮：− ＋（球权是往左、往右），点一下动一格，按住一直动 */
.slw{display:flex;align-items:center;min-width:0}
.slw .sl{flex:1;min-width:0}
.slb{flex:none;width:36px;height:36px;padding:0;border:0;border-radius:18px;background:var(--paper);box-shadow:inset 0 0 0 1px var(--rule);color:var(--ink2);display:flex;align-items:center;justify-content:center;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.slb svg{width:16px;height:16px;pointer-events:none}
.slb:active,.slb.on{background:var(--rule);color:var(--ink)}
.slw.big .slb{width:40px;height:40px;border-radius:20px}
.slw.big .slb svg{width:18px;height:18px}

/* ---------- 两个问题 ---------- */
.qcard{background:var(--card);border:1px solid var(--line2);border-radius:18px;padding:14px 14px 10px;display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.qq{margin:0;font-size:22px;line-height:1.3;font-weight:800;letter-spacing:.01em}
.qh{display:flex;align-items:baseline;gap:10px;min-height:36px}
.qh .qq{flex:1;min-width:0}
.qval{font:700 36px/1 var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap;flex:none}
.qval small{font:700 17px var(--f-ui);margin-left:1px}
.qval.na{font:600 15px/1.2 var(--f-ui);color:var(--muted)}
.qsub{display:flex;align-items:baseline;gap:10px;font-size:13px;color:var(--muted);min-width:0}
.qd{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qw{font-weight:700;color:var(--ink);white-space:nowrap;flex:none}
.qends{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12.5px;color:var(--muted);padding:0 4px}
.qends>span:first-child,.qends>span:last-child{flex:none}
.qnote{text-align:center;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qcard>*{flex:none}   /* 卡片变矮时里面的东西不要被压扁 */

const tapAt = [0, 0], doneAt = [0, 0];
function tapArrive(i){
  if (M.st === 2){ endedToast(); return; }
  const o = ocEv(i);
  if (o && !o.pa && Date.now() - tapAt[i] < 400) return;
  tapAt[i] = Date.now();
  const e = addEv(i, 'ar', { pa: '' });
  OC[i] = { k: e.k, at: Date.now(), dt: null };
  lastAdd = { k: e.k, i: i, at: Date.now() };
  renderAll();
  flash('.pad[data-i="' + i + '"] [data-a="ar"]');
  clockTip();
}
let noArrTip = 0;
function pick(i, c){
  if (M.st === 2){ endedToast(); return; }
  let e = ocEv(i);
  const now = Date.now();
  if (now - tapAt[i] < 220 && e && e.pa) return;
  if (!e && now - doneAt[i] < 500) return;
  tapAt[i] = now;
  if (!e){
    if (CH.indexOf(c) < 0) return;
    // 没按“到达”就直接点选择：也算一次到达，用时不详
    e = addEv(i, 'ar', { pa: '' });
    OC[i] = { k: e.k, at: 0, dt: null };
    lastAdd = { k: e.k, i: i, at: Date.now() };
    if (!noArrTip){ noArrTip = 1; showToast('没按“到达”直接点了选择：也算一次到达，用时记成不详'); }
  }
  const nd = tipOf(e.pa);
  if (!nd.o || nd.o.indexOf(c) < 0) return;
  if (!e.pa){
    const o = OC[i];
    const dt = o.dt != null ? o.dt : o.at ? Math.round((Date.now() - o.at) / 100) / 10 : null;
    if (dt != null) e.dt = dt; else delete e.dt;
    o.dt = dt;
  }
  e.pa += c;
  const res = resOf(e.pa);
  const merged = res === 'c' ? mergeAuto(i, 'ck') : res === 'g' ? mergeAuto(i, 'gl') : false;
  const done = isDone(e.pa);
  if (done){ OC[i] = null; doneAt[i] = now; }
  save(); renderAll();
  if (done) flash('.pad[data-i="' + i + '"] [data-a="ar"]');
  if (res === 'g') showToast(teamName(i) + ' 进球 ' + score(M).join('–') + (merged ? '（跟联网补上的那球合并）' : ''));
  else if (res === 'c') showToast(teamName(i) + ' 角球，共 ' + cornersOf(M, 'ft')[i] + ' 个' + (merged ? '（跟联网补上的角球合并）' : ''));
  clockTip();
}

  else showToast(teamName(i) + ' 角球，共 ' + cornersOf(M, 'ft')[i] + ' 个' + (merged ? '（跟联网补上的角球合并）' : ''));

/* 进球预测的“进球 ＋1”：记下时间（以后可以统计每种判断下进球多不多）；跟联网补上的那球合并，撤销时放回去 */

/* 一队一个半场里，简易模型提醒“大角”“小角”各几分钟 */
function alSum(m, i, p, g){
  const sp = halfSpan(m, p); if (!sp) return '';
  const L = m.al.filter(a => a.g === g && a.i === i).sort((a, b) => a.p - b.p || a.t - b.t), dur = { b: 0, s: 0 };
  let v = '', t0 = sp[0];
  for (const a of L) if (a.p < p || (a.p === p && a.t <= sp[0])) v = a.v;
  for (const a of L){
    if (a.p !== p || a.t <= sp[0]) continue;
    const t1 = Math.min(a.t, sp[1]);
    if (v && t1 > t0) dur[v] += t1 - t0;
    t0 = Math.max(t0, t1); v = a.v;
  }
  if (v && sp[1] > t0) dur[v] += sp[1] - t0;
  const out = [];
  if (dur.b >= 30) out.push('大角 ' + Math.round(dur.b / 60) + ' 分钟');
  if (dur.s >= 30) out.push('小角 ' + Math.round(dur.s / 60) + ' 分钟');
  return out.join(' / ');
}

  return 0.8 * 2 * hit / (ba.length + bb.length);
}

    case 'expall': saveNow(); openExport(whAll()); break;
    case 'expcsv': saveNow(); openCsv(whAll()); break;
    case 'expcsvh': saveNow(); openCsvHalf(whAll()); break;
    case 'exp1': saveNow(); openExport([M]); break;
    case 'import': openSheet('import'); break;
    case 'pickfile': $('#fileIn').click(); break;
    case 'imptext': importText($('#impText').value); break;
    case 'share': shareFile(); break;
    case 'download': downloadFile(); break;
    case 'copy': copyText(); break;
    case 'pip': openSheet('pip'); break;
    case 'pippos': PIP.pos = b.dataset.v; savePip(); renderSheet(); break;
    case 'piph': PIP.h = +b.dataset.v; savePip(); renderSheet(); break;
    case 'pipn': PIP.h = clamp(PIP.h + +b.dataset.d, 100, 320); savePip(); renderSheet(); break;
    // 计时
    case 'kick': { const p = +b.dataset.p; const dl = kick(p); save(); closeSheet(); renderAll(); showToast(PER[p][2] + '开球，计时开始' + delayNote(dl)); break; }
    case 'toggle': if (M.tm.r) pauseClock(); else startClock(); save(); renderAll(); renderSheet(); break;
    case 'endh': endFirstHalf(); OC[0] = OC[1] = null; save(); closeSheet(); renderAll(); showToast('上半场结束。下半场开球时按 ▶'); break;
    case 'nudge': setClock(clockOf(M) + +b.dataset.d); save(); renderAll(); renderSheet(); break;
    case 'tpp': tpHalf(d.tp, +b.dataset.p); renderSheet(); break;
    case 'tpn': tpSet(d.tp, tpNow(d.tp) + +b.dataset.d); tpShow(d.tp); break;
    case 'tpset': {
      const v = tpNow(d.tp);
      if (M.tm.ht && d.tp.p === 2){ M.tm.ht = 0; }
      if (d.tp.p !== M.tm.p){ if (d.tp.p === 2 && !M.pe[1]) M.pe[1] = Math.max(2700, maxT(M, 1)); M.tm.p = d.tp.p; }
      M.tm.b = v; if (M.tm.r) M.tm.at = Date.now();
      if (!M.obs || (!M.ev.some(e => !e.b) && !M.sv.length && !M.tm.r)) M.obs = { p: d.tp.p, t: v };
      const dl = M.api && M.tm.r ? learnDelay(clockOf(M), 'set') : null;
      save(); closeSheet(); renderAll(); showToast('时间设定为 ' + fmtClock(d.tp.p, v) + (M.tm.r ? '' : '，按 ▶ 开始计时') + delayNote(dl)); break;
    }
    // 补录、结束
    case 'fix': {
      setMid(false);
      if (M.st === 2){ endedToast(); break; }
      const all = [statOf(M, 0, 'ft'), statOf(M, 1, 'ft')];
      openSheet('fix', { sc: score(M), c1: cornersOf(M, 'h1'), c2: cornersOf(M, 'h2'), rc: [all[0].rc, all[1].rc] });
      sheetData.orig = JSON.parse(JSON.stringify(sheetData));
      break;
    }
    case 'fs': { const f = b.dataset.f, i = +b.dataset.i; d[f][i] = Math.max(0, d[f][i] + +b.dataset.d); renderSheet(); break; }
    case 'fsave': applyFix(d); closeSheet(); renderAll(); showToast('已保存'); break;
    case 'note': openSheet('note'); break;
    case 'finish': setMid(false); openSheet('finish'); break;
    case 'fkeep': finishMatch(); M.keep = 1; OC[0] = OC[1] = null; saveNow(); closeSheet(); renderAll(); showToast('已结束并加入仓库', startNew, '开始新比赛', 7000); break;
    case 'fdrop': closeSheet(); dropMatch(M, '已删除这场'); break;
    case 'reopen': M.st = 1; M.stop = null; save(); closeSheet(); renderAll(); showToast('已重新打开，可以接着记录'); break;
    case 'new': closeSheet(); askNew(); break;
    case 'nq1': finishMatch(); M.keep = 1; saveNow(); closeSheet(); startNew(); break;
    case 'nq2': closeSheet(); startNew(); break;
    case 'nq3': { closeSheet(); const old = M; delete store[old.id]; LS.set(KEY, store); M = newMatch(old); OC[0] = OC[1] = null; saveNow(); renderAll(); showToast('已删除，开始新比赛', () => { store[old.id] = old; LS.set(KEY, store); M = old; saveNow(); renderAll(); }); break; }
  }
});
card.addEventListener('input', ev => {
  if (ev.target.id === 'whQ' && sheetKind === 'arch'){ sheetData.q = ev.target.value; const l = $('#whList'); if (l) l.innerHTML = whListHTML(sheetData); return; }
  if (ev.target.id === 'noteIn'){ M.note = ev.target.value.slice(0, 2000); save(); return; }
  if (ev.target.id === 'tpR' && sheetData.tp){ tpSet(sheetData.tp, +ev.target.value); tpShow(sheetData.tp); }
});
sheet.addEventListener('click', ev => { if (ev.target === sheet) closeSheet(); });
$('#runBtn').addEventListener('click', () => {
  if (M.st === 2){ endedToast(); return; }
  if (M.tm.ht){ const dl = kick(2); save(); renderAll(); showToast('下半场开球' + delayNote(dl)); return; }
  if (M.tm.r) pauseClock();
  else { if (!M.tm.b && M.tm.p === 1 && !M.ev.some(e => !e.b)) { const dl = kick(1); showToast('上半场开球，计时开始' + delayNote(dl)); } else startClock(); }
  save(); renderAll();
});
for (const [id, key] of [['#fH', 'h'], ['#fA', 'a'], ['#fLg', 'lg']]){
  const el = $(id);
  el.addEventListener('focus', () => { if (M.st === 2){ el.blur(); endedToast(); } });
  el.addEventListener('input', () => { if (M.st === 2){ el.value = M[key]; return; } M[key] = el.value; save(); renderPads(); renderStats(); if (key !== 'lg'){ if (M.api && !M.ev.length){ M.api = null; } scheduleFind(); renderNet(); } });
  el.addEventListener('keydown', e => { if (e.key === 'Enter') el.blur(); });
}
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !sheet.hidden) closeSheet(); });
let wasPhone = isPhone();
window.addEventListener('resize', () => { if (isPhone() !== wasPhone){ wasPhone = isPhone(); setMid(false); renderAll(); } });

/* ================= 离线 ================= */
let offline = '离线使用：第一次联网打开后就能离线使用。';
if ('serviceWorker' in navigator && window.isSecureContext && location.protocol !== 'file:'){
  let hadCtrl = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!hadCtrl){ hadCtrl = true; return; }
    showToast('新版本已经下载好，你的记录都已存好', () => location.reload(), '现在更新', 30000);
  });
  navigator.serviceWorker.register('./sw.js').then(reg => {
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') reg.update().catch(() => {}); });
    return navigator.serviceWorker.ready;
  }).then(() => { offline = '离线使用：已准备好，没有网络也能从主屏幕打开。'; }).catch(() => {});
}
renderAll();
window.__reach = { get M(){ return M; }, store: () => store, statOf: statOf, stateSplit: stateSplit, walk: walk, paLabel: paLabel, OC: OC, minsOf: minsOf,
  get MODEL(){ return MODEL; }, mAll: mAll, get MN(){ return MN; }, render: () => renderAll(), fmtMV: fmtMV, bucketOf: bucketOf, PREF: PREF };

})();
</script>
